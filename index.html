<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Open in Outlook</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid #d9deea;
      border-radius: 22px;
      background: white;
      box-shadow: 0 18px 55px rgba(26, 43, 74, .12);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #0a64ad;
      color: white;
      font-size: 32px;
      font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0 0 20px; line-height: 1.5; color: #526079; }
    a {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      background: #0a64ad;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
    }
    small { display: block; margin-top: 18px; color: #69758a; line-height: 1.45; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      body { background: #10131a; color: #f4f7ff; }
      main { background: #191e28; border-color: #303849; box-shadow: none; }
      p, small { color: #b7c0d1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">O</div>
    <h1>Opening Outlook…</h1>
    <p id="status">If Outlook does not open automatically, tap the button below.</p>
    <a id="open-button" href="#">Open in Outlook</a>
    <small>The message identifier stays in this page’s URL fragment and is not sent to the web host.</small>
  </main>
  <script>
    (() => {
      const encodedRestId = window.location.hash.slice(1);
      const button = document.getElementById('open-button');
      const status = document.getElementById('status');

      if (!encodedRestId) {
        button.hidden = true;
        status.textContent = 'This Outlook link is incomplete.';
        return;
      }

      let restId;
      try {
        restId = decodeURIComponent(encodedRestId);
      } catch {
        button.hidden = true;
        status.textContent = 'This Outlook link is malformed.';
        return;
      }

      const outlookUrl = 'ms-outlook://emails/message/open?restID=' + encodeURIComponent(restId);
      button.href = outlookUrl;

      window.setTimeout(() => {
        window.location.assign(outlookUrl);
      }, 250);
    })();
  </script>
</body>
</html>
